services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    container_name: wageringDatabase
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wageringDatabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - wagering-data:/var/lib/postgresql/data

volumes:
  wagering-data: